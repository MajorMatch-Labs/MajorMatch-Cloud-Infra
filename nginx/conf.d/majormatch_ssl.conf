# ====================================================================
# Nginx Reverse Proxy Configuration with Let's Encrypt SSL
# Domain: majormatch.vanhoang.online
# Topology: AWS EC2 Cloud Gateway (Port 8001) + Next.js Standalone (Port 3000)
# ====================================================================

server {
    server_name majormatch.vanhoang.online;

    client_max_body_size 25M;

    # 1. API Reverse Proxy toi Cloud Gateway Persistence Engine (Port 8001 tren AWS EC2)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Toi uu hoa dac thu cho Server-Sent Events (SSE) Streaming tu Qwen 2.5 7B
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 2. Next.js Client Frontend Tier (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/majormatch.vanhoang.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/majormatch.vanhoang.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Chuyen huong toan bo luu luong HTTP (Port 80) sang HTTPS (Port 443)
server {
    if ($host = majormatch.vanhoang.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name majormatch.vanhoang.online;
    return 404; # managed by Certbot
}
