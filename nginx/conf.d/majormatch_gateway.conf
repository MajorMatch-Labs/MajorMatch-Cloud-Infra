# Giới hạn tần suất Token Bucket Rate Limiting chống DDoS và sập GPU
limit_req_zone $binary_remote_addr zone=ai_inference_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=60r/m;
limit_req_status 429;

# Cụm máy chủ tính toán AI HPC (kết nối nội bộ qua Docker Network hoặc Tailscale Mesh VPN)
upstream backend_hpc_cluster {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.majormatch.vn localhost 127.0.0.1;

    include /etc/nginx/conf.d/security_headers.conf;
    client_max_body_size 15M;

    # Liveness health check cho Edge Gateway
    location /healthz {
        access_log off;
        return 200 "Edge Gateway Operational\n";
        add_header Content-Type text/plain;
    }

    # Giới hạn tần suất nghiêm ngặt đối với tác vụ AI nặng (RAG & Cosine Analysis)
    location ~ ^/api/v1/(roadmap/generate|analysis/skill-gap) {
        limit_req zone=ai_inference_limit burst=3 nodelay;

        proxy_pass http://backend_hpc_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Hỗ trợ Server-Sent Events (SSE) cho Chatbot Cố vấn Streaming
    location /api/v1/roadmap/chat {
        limit_req zone=ai_inference_limit burst=5 nodelay;

        proxy_pass http://backend_hpc_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt bộ đệm để truyền token mượt mà
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }

    # Các API thông thường (Bóc tách PDF bảng điểm, Health Check)
    location /api/ {
        limit_req zone=general_api_limit burst=10 nodelay;

        proxy_pass http://backend_hpc_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
